{% extends "email/base_email.html" %}

{% block content %}
    <h2>Привет, {{ username }}!</h2>
    <p>Вам была назначена новая задача.</p>
    
    <div style="background-color: #f4f5f7; padding: 15px; border-radius: 5px; margin: 20px 0;">
        <h3 style="margin-top: 0; color: #172b4d;">{{ task_title }}</h3>
        <p style="color: #5e6c84;">{{ task_description }}</p>
        <p style="margin-bottom: 0;"><strong>Приоритет:</strong> {{ priority }}</p>
        <p style="margin-bottom: 0;"><strong>Срок выполнения:</strong> {{ due_date }}</p>
    </div>
    
    <p style="text-align: center;">
        <a href="{{ action_url }}" class="btn">Посмотреть задачу</a>
    </p>
{% endblock %}
