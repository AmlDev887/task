<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.5; max-width: 600px; margin: 0 auto; padding: 20px;">
    
    <h2 style="color: #2c3e50;">Привет, {{ username }}! 👋</h2>
    <p>Вот список твоих незавершенных задач на сегодня:</p>

    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
        <thead>
            <tr style="background-color: #f4f6f8; text-align: left;">
                <th style="padding: 10px; border: 1px solid #ddd;">Задача</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Дедлайн</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Статус</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td style="padding: 10px; border: 1px solid #ddd;">
                    <strong>{{ task.title }}</strong>
                </td>
                <td style="padding: 10px; border: 1px solid #ddd; color: {{ task.color }};">
                    {{ task.due_date }}
                </td>
                <td style="padding: 10px; border: 1px solid #ddd;">
                    {{ task.status }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p style="margin-top: 25px; font-size: 12px; color: #888;">
        Это автоматическое уведомление от твоего таск-менеджера.
    </p>

</body>
</html>
